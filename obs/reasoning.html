<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    width: 480px;
    height: 700px;
    font-family: 'Consolas', monospace;
    color: #e0e0e0;
  }
  #container {
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.75);
    border-left: 3px solid rgba(100, 200, 255, 0.6);
    padding: 16px;
    display: flex;
    flex-direction: column;
  }
  #header {
    font-size: 18px;
    font-weight: bold;
    color: rgba(100, 200, 255, 0.9);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 12px;
    flex-shrink: 0;
  }
  #log {
    overflow-y: auto;
    flex: 1;
    scrollbar-width: none;
  }
  #log::-webkit-scrollbar { display: none; }
  .block {
    font-size: 20px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
    margin-bottom: 16px;
    padding: 10px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 4px;
    overflow: hidden;
    transition: opacity 0.5s ease, max-height 0.5s ease, margin-bottom 0.5s ease;
  }
  .block .action {
    display: block;
    margin: 8px -10px -10px -10px;
    padding: 6px 10px;
    background: rgba(255, 160, 30, 0.15);
    border-top: 1px solid rgba(255, 160, 30, 0.3);
    color: rgba(255, 180, 50, 1);
    font-size: 18px;
  }
</style>
</head>
<body>
<div id="container">
  <div id="header" data-i18n="agent_reasoning">Agent Reasoning</div>
  <div id="log"></div>
</div>
<script>
  const log = document.getElementById('log');
  const MAX_BLOCKS = 20;
  let currentBlock = null;
  let currentText = null;

  function pruneOldBlocks() {
    while (log.children.length > MAX_BLOCKS) {
      const old = log.firstElementChild;
      old.remove();
    }
  }

  function ensureBlock() {
    if (!currentBlock) {
      currentBlock = document.createElement('div');
      currentBlock.className = 'block';
      currentText = document.createElement('span');
      currentBlock.appendChild(currentText);
      log.appendChild(currentBlock);
      pruneOldBlocks();
    }
  }

  // New decision — start a new block (don't erase history)
  window.addEventListener('reasoning-clear', function() {
    currentBlock = null;
    currentText = null;
  });

  // Streaming: append delta text to current block
  window.addEventListener('reasoning-delta', function(event) {
    const text = event.detail.text || '';
    ensureBlock();
    currentText.textContent += text;
    log.scrollTop = log.scrollHeight;
  });

  // Bulk update — append as a complete block
  window.addEventListener('reasoning-update', function(event) {
    const text = event.detail.text || '';
    currentBlock = null;
    currentText = null;
    ensureBlock();
    currentText.textContent = text;
    log.scrollTop = log.scrollHeight;
  });

  // Action taken — append action line to current block, then close it
  window.addEventListener('reasoning-action', function(event) {
    const text = event.detail.text || '';
    ensureBlock();
    const actionEl = document.createElement('span');
    actionEl.className = 'action';
    actionEl.textContent = text;
    currentBlock.appendChild(actionEl);
    log.scrollTop = log.scrollHeight;
    currentBlock = null;
    currentText = null;
  });

  // Restore from state.json on load
  fetch('state.json').then(r => r.json()).then(state => {
    const blocks = state.reasoning_blocks;
    if (blocks && blocks.length) {
      for (const b of blocks) {
        const div = document.createElement('div');
        div.className = 'block';
        const textSpan = document.createElement('span');
        textSpan.textContent = b.text || '';
        div.appendChild(textSpan);
        if (b.action) {
          const actionEl = document.createElement('span');
          actionEl.className = 'action';
          actionEl.textContent = b.action;
          div.appendChild(actionEl);
        }
        log.appendChild(div);
      }
      log.scrollTop = log.scrollHeight;
      pruneOldBlocks();
    }
  }).catch(() => {});

  // Load locale strings
  fetch('locale.json').then(r => r.json()).then(loc => {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      if (loc[key]) el.textContent = loc[key];
    });
  }).catch(() => {});

  // Bridge: accept postMessage and re-dispatch as CustomEvent (for iframe testing)
  window.addEventListener('message', function(msg) {
    if (msg.data && msg.data._event) {
      window.dispatchEvent(new CustomEvent(msg.data._event, { detail: msg.data.detail || {} }));
    }
  });
</script>
</body>
</html>
