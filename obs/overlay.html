<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    overflow: hidden;
    width: 1440px;
    height: 80px;
    font-family: 'Consolas', monospace;
    color: #e0e0e0;
  }
  #bar {
    display: flex;
    justify-content: space-around;
    align-items: center;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding: 0 60px;
  }
  .stat {
    text-align: center;
  }
  .label {
    font-size: 18px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #888;
  }
  .value {
    font-size: 36px;
    font-weight: bold;
    color: #fff;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
<div id="bar">
  <div class="stat">
    <div class="label" data-i18n="rounds">Rounds</div>
    <div class="value" id="round">0</div>
  </div>
  <div class="stat">
    <div class="label" data-i18n="time">Time</div>
    <div class="value" id="time">0:00:00</div>
  </div>
  <div class="stat">
    <div class="label" data-i18n="high_score">High Score</div>
    <div class="value" id="high-score">0</div>
  </div>
</div>
<script>
  // --- Timer ---
  let startTime = null;
  let elapsed = 0;
  let running = false;
  let rafId = null;
  const timeEl = document.getElementById('time');

  function fmt(ms) {
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function tick() {
    if (!running) return;
    timeEl.textContent = fmt(elapsed + (performance.now() - startTime));
    rafId = requestAnimationFrame(tick);
  }

  function timerStart() {
    if (running) return;
    running = true;
    startTime = performance.now();
    rafId = requestAnimationFrame(tick);
  }

  function timerPause() {
    if (!running) return;
    elapsed += performance.now() - startTime;
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
  }

  function timerReset() {
    timerPause();
    elapsed = 0;
    startTime = null;
    timeEl.textContent = '0:00:00';
  }

  window.addEventListener('timer-control', function(event) {
    const action = event.detail.action;
    if (action === 'start') timerStart();
    else if (action === 'pause') timerPause();
    else if (action === 'reset') timerReset();
    else if (action === 'restart') { timerReset(); timerStart(); }
  });

  // --- Round ---
  const roundEl = document.getElementById('round');
  window.addEventListener('round-update', function(event) {
    roundEl.textContent = event.detail.value;
  });

  // --- High Score ---
  const hsEl = document.getElementById('high-score');
  window.addEventListener('high-score-update', function(event) {
    hsEl.textContent = event.detail.value;
  });

  // Restore from state.json on load
  fetch('state.json').then(r => r.json()).then(state => {
    if (state.total_rounds !== undefined) roundEl.textContent = state.total_rounds;
    if (state.high_score !== undefined) hsEl.textContent = state.high_score;
  }).catch(() => {});

  // Load locale strings
  fetch('locale.json').then(r => r.json()).then(loc => {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      if (loc[key]) el.textContent = loc[key];
    });
  }).catch(() => {});

  // Bridge: accept postMessage and re-dispatch as CustomEvent (for iframe testing)
  window.addEventListener('message', function(msg) {
    if (msg.data && msg.data._event) {
      window.dispatchEvent(new CustomEvent(msg.data._event, { detail: msg.data.detail || {} }));
    }
  });
</script>
</body>
</html>
