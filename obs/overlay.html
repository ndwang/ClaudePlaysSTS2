<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    overflow: hidden;
    width: 1440px;
    height: 80px;
    font-family: 'Consolas', monospace;
    color: #e0e0e0;
  }
  #bar {
    display: flex;
    justify-content: space-around;
    align-items: center;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding: 0 60px;
  }
  .stat {
    text-align: center;
  }
  .label {
    font-size: 18px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #888;
  }
  .value {
    font-size: 36px;
    font-weight: bold;
    color: #fff;
    letter-spacing: 2px;
  }
@keyframes shimmer {
    0%   { background-position: -200% center; }
    100% { background-position: 200% center; }
  }
  .value.shimmer {
    background: linear-gradient(
      90deg,
      #888 0%,
      #fff 25%,
      #64c8ff 50%,
      #fff 75%,
      #888 100%
    );
    background-size: 200% 100%;
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 2s ease-in-out infinite;
  }
</style>
</head>
<body>
<div id="bar">
  <div class="stat">
    <div class="label" data-i18n="rounds">Rounds</div>
    <div class="value" id="round">0</div>
  </div>
  <div class="stat">
    <div class="label" data-i18n="time">Time</div>
    <div class="value" id="time">0:00:00</div>
  </div>
  <div class="stat">
    <div class="label" data-i18n="high_floor">High Floor</div>
    <div class="value" id="high-floor">0</div>
  </div>
  <div class="stat">
    <div class="label" data-i18n="cost">Cost</div>
    <div class="value" id="cost">$0.00</div>
  </div>
  <div class="stat">
    <div class="label" data-i18n="status">Status</div>
    <div class="value" id="status" data-i18n-value="status_waiting">Waiting</div>
  </div>
  <div class="stat">
    <div class="label" data-i18n="model">Model</div>
    <div class="value" id="model">-</div>
  </div>
</div>
<script>
  // --- Timer (elapsed + epoch, survives refresh) ---
  let timerElapsed = 0;  // seconds accumulated from previous sessions
  let timerEpoch = 0;    // Unix timestamp (seconds) when current session started
  let rafId = null;
  const timeEl = document.getElementById('time');

  function fmt(ms) {
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    return h + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function tick() {
    if (!timerEpoch) return;
    const sessionSec = Date.now() / 1000 - timerEpoch;
    timeEl.textContent = fmt((timerElapsed + sessionSec) * 1000);
    rafId = requestAnimationFrame(tick);
  }

  function timerSync(elapsed, epoch) {
    timerElapsed = elapsed || 0;
    timerEpoch = epoch || 0;
    if (rafId) cancelAnimationFrame(rafId);
    if (timerEpoch) {
      rafId = requestAnimationFrame(tick);
    } else {
      timeEl.textContent = fmt(timerElapsed * 1000);
    }
  }

  window.addEventListener('timer-sync', function(event) {
    timerSync(event.detail.elapsed, event.detail.epoch);
  });

  // --- Round ---
  const roundEl = document.getElementById('round');
  window.addEventListener('round-update', function(event) {
    roundEl.textContent = event.detail.value;
  });

  // --- High Floor ---
  const hsEl = document.getElementById('high-floor');
  window.addEventListener('high-floor-update', function(event) {
    hsEl.textContent = event.detail.value;
  });

  // --- Cost ---
  const costEl = document.getElementById('cost');
  window.addEventListener('cost-update', function(event) {
    costEl.textContent = '$' + Number(event.detail.value).toFixed(2);
  });

  // --- Model ---
  const modelEl = document.getElementById('model');
  window.addEventListener('model-update', function(event) {
    modelEl.textContent = event.detail.value || '-';
  });

  // --- Status ---
  const statusEl = document.getElementById('status');
  const ACTIVE_STATUSES = new Set(['thinking', 'reflecting', 'summarizing']);
  let statusLocale = {};
  window.addEventListener('status-update', function(event) {
    const status = event.detail.value;
    const key = 'status_' + status;
    statusEl.textContent = statusLocale[key] || status;
    statusEl.classList.toggle('shimmer', ACTIVE_STATUSES.has(status));
  });

  // Restore from state.json on load
  fetch('state.json').then(r => r.json()).then(state => {
    if (state.total_rounds !== undefined) roundEl.textContent = state.total_rounds;
    if (state.high_floor !== undefined) hsEl.textContent = state.high_floor;
    if (state.timer_elapsed !== undefined) {
      // Show accumulated time, but don't tick (agent may not be running)
      timerSync(state.timer_elapsed, 0);
    }
  }).catch(() => {});

  // Restore cost from token_usage.json
  fetch('../token_usage.json').then(r => r.json()).then(data => {
    if (data.cost_usd !== undefined) costEl.textContent = '$' + Number(data.cost_usd).toFixed(2);
  }).catch(() => {});

  // Load locale strings
  fetch('locale.json').then(r => r.json()).then(loc => {
    statusLocale = loc;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.dataset.i18n;
      if (loc[key]) el.textContent = loc[key];
    });
    document.querySelectorAll('[data-i18n-value]').forEach(el => {
      const key = el.dataset.i18nValue;
      if (loc[key]) el.textContent = loc[key];
    });
  }).catch(() => {});

  // Bridge: accept postMessage and re-dispatch as CustomEvent (for iframe testing)
  window.addEventListener('message', function(msg) {
    if (msg.data && msg.data._event) {
      window.dispatchEvent(new CustomEvent(msg.data._event, { detail: msg.data.detail || {} }));
    }
  });
</script>
</body>
</html>
