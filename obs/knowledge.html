<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    width: 480px;
    height: 380px;
    font-family: 'Consolas', monospace;
    color: #e0e0e0;
  }
  #container {
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.75);
    border-left: 3px solid rgba(200, 160, 60, 0.6);
    padding: 16px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    scrollbar-width: none;
  }
  #container::-webkit-scrollbar { display: none; }

  .section {
    margin-bottom: 16px;
  }
  .section-header {
    font-size: 18px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.15);
  }
  .section-header.in-run {
    color: rgba(100, 200, 255, 0.9);
  }
  .entry {
    margin-bottom: 8px;
    font-size: 18px;
    line-height: 1.5;
    overflow: hidden;
    max-height: 200px;
    opacity: 1;
    transition: max-height 0.8s ease, opacity 0.8s ease, margin-bottom 0.8s ease;
  }
  .entry.collapsed {
    max-height: 0;
    opacity: 0;
    margin-bottom: 0;
  }
  .entry-key {
    color: #fff;
    font-weight: bold;
  }
  .entry-value {
    color: #bbb;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .entry-cursor::after {
    content: '\2588';
    color: #bbb;
    animation: blink 0.6s step-end infinite;
  }
  .empty {
    color: #666;
    font-style: italic;
    font-size: 16px;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
</style>
</head>
<body>
<div id="container">
  <div class="section" id="in-run-section">
    <div class="section-header in-run">Current Run Notes</div>
    <div id="in-run-entries"><span class="empty">No notes yet</span></div>
  </div>
</div>
<script>
  const inRunEl = document.getElementById('in-run-entries');

  const TYPE_MS = 25;       // ms per character typing
  const ERASE_MS = 10;      // ms per character erasing
  const queues = {};         // key -> promise chain (sequential per key, parallel across keys)
  const targetValues = {};   // key -> intended final value (to avoid re-diffing mid-animation)

  function sleep(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  // Queue an async operation for a given key. Same-key ops run sequentially; different keys run in parallel.
  function enqueue(key, fn) {
    const prev = queues[key] || Promise.resolve();
    queues[key] = prev.then(fn).catch(() => {});
  }

  // Type text into el one character at a time
  async function typewrite(el, text) {
    el.classList.add('entry-cursor');
    for (let i = 0; i < text.length; i++) {
      el.textContent += text[i];
      await sleep(TYPE_MS);
    }
    el.classList.remove('entry-cursor');
  }

  // Erase el's text back-to-front one character at a time
  async function erasewrite(el) {
    el.classList.add('entry-cursor');
    while (el.textContent.length > 0) {
      el.textContent = el.textContent.slice(0, -1);
      await sleep(ERASE_MS);
    }
    el.classList.remove('entry-cursor');
  }

  // Slide-expand an entry element (starts collapsed)
  function slideIn(el) {
    return new Promise(resolve => {
      el.classList.add('collapsed');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        el.addEventListener('transitionend', resolve, { once: true });
        el.classList.remove('collapsed');
      }));
    });
  }

  // Slide-collapse an entry element, then remove it
  function slideOut(el) {
    return new Promise(resolve => {
      el.addEventListener('transitionend', () => { el.remove(); resolve(); }, { once: true });
      el.classList.add('collapsed');
    });
  }

  function animateInsert(container, key, value) {
    targetValues[key] = value;
    enqueue(key, async () => {
      const div = document.createElement('div');
      div.className = 'entry collapsed';
      div.dataset.key = key;
      const keySpan = document.createElement('span');
      keySpan.className = 'entry-key';
      keySpan.textContent = key + ': ';
      const valSpan = document.createElement('span');
      valSpan.className = 'entry-value';
      div.appendChild(keySpan);
      div.appendChild(valSpan);
      container.appendChild(div);

      await slideIn(div);
      await typewrite(valSpan, value);
    });
  }

  function animateRemove(container, key) {
    delete targetValues[key];
    enqueue(key, async () => {
      const el = container.querySelector(`.entry[data-key="${CSS.escape(key)}"]`);
      if (!el) return;
      const valSpan = el.querySelector('.entry-value');
      if (valSpan) await erasewrite(valSpan);
      await slideOut(el);
    });
  }

  function animateEdit(container, key, newValue) {
    targetValues[key] = newValue;
    enqueue(key, async () => {
      const el = container.querySelector(`.entry[data-key="${CSS.escape(key)}"]`);
      if (!el) return;
      const valSpan = el.querySelector('.entry-value');
      if (!valSpan) return;

      await erasewrite(valSpan);
      await typewrite(valSpan, newValue);
    });
  }

  function diffEntries(container, entries) {
    const keys = Object.keys(entries || {});

    // Remove the "empty" placeholder if we have entries
    const emptyEl = container.querySelector('.empty');
    if (keys.length > 0 && emptyEl) emptyEl.remove();

    // Track existing entry elements by key
    const existing = {};
    for (const el of Array.from(container.querySelectorAll('.entry'))) {
      existing[el.dataset.key] = el;
    }

    // Remove entries no longer present
    for (const key of Object.keys(existing)) {
      if (!entries || !(key in entries)) {
        animateRemove(container, key);
      }
    }

    // Add or update entries
    for (const key of keys) {
      const value = entries[key];
      const known = existing[key] || (key in targetValues);
      if (known) {
        // Only animate edit if the target value actually changed
        if (targetValues[key] !== value) {
          animateEdit(container, key, value);
        }
      } else {
        animateInsert(container, key, value);
      }
    }

    // Show empty placeholder if no entries remain (after animations finish)
    if (keys.length === 0 && !container.querySelector('.empty')) {
      setTimeout(() => {
        if (container.querySelectorAll('.entry').length === 0 && !container.querySelector('.empty')) {
          container.innerHTML = '<span class="empty">No entries yet</span>';
        }
      }, 1500);
    }
  }

  window.addEventListener('kb-update', function(event) {
    const data = event.detail;
    diffEntries(inRunEl, data.in_run || {});
  });

  // Instant render (no animation) for restoring state on load
  function renderInstant(container, entries) {
    if (!entries || Object.keys(entries).length === 0) return;
    container.querySelector('.empty')?.remove();
    for (const [key, value] of Object.entries(entries)) {
      targetValues[key] = value;
      const div = document.createElement('div');
      div.className = 'entry';
      div.dataset.key = key;
      const keySpan = document.createElement('span');
      keySpan.className = 'entry-key';
      keySpan.textContent = key + ': ';
      const valSpan = document.createElement('span');
      valSpan.className = 'entry-value';
      valSpan.textContent = value;
      div.appendChild(keySpan);
      div.appendChild(valSpan);
      container.appendChild(div);
    }
  }

  // Restore from state.json on load
  fetch('state.json').then(r => r.json()).then(state => {
    const kb = state.kb;
    if (kb) {
      renderInstant(inRunEl, kb.in_run || {});
    }
  }).catch(() => {});

  // Bridge: accept postMessage and re-dispatch as CustomEvent (for iframe testing)
  window.addEventListener('message', function(msg) {
    if (msg.data && msg.data._event) {
      window.dispatchEvent(new CustomEvent(msg.data._event, { detail: msg.data.detail || {} }));
    }
  });
</script>
</body>
</html>
